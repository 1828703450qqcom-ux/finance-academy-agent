services:
  backend:
    build: ./backend
    container_name: finance-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      MINIMAX_API_URL: ${MINIMAX_API_URL:-https://minimax.chat/v1/chat/completions}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:?Set MINIMAX_API_KEY in .env}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7-highspeed}
      FINANCE_DB_PATH: /app/data/finance_agent.db

  frontend:
    build: ./frontend
    container_name: finance-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
