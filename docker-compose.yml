version: '3.8'

services:
  backend:
    build: ./backend
    container_name: finance-backend
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: finance-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
